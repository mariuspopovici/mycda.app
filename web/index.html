<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- the reader's color scheme before first paint, as Mantine's ColorSchemeScript does (key from main.tsx) -->
    <script>
      try {
        var stored = window.localStorage.getItem('mycda-color-scheme')
        var scheme = stored === 'light' || stored === 'dark' ? stored : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-mantine-color-scheme', scheme)
      } catch (e) {}
    </script>
    <meta name="description" content="Estimate your cycling drag area (CdA) and rolling resistance (Crr) from power meter field tests. Free, with a step-by-step guide to testing positions and equipment." />
    <title>MyCdA – field testing for cycling aerodynamics</title>
    <!-- social previews; pages update the title, description and URL (lib/pageMeta.ts) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MyCdA" />
    <meta property="og:title" content="MyCdA – field testing for cycling aerodynamics" />
    <meta property="og:description" content="Estimate your cycling drag area (CdA) and rolling resistance (Crr) from power meter field tests. Free, with a step-by-step guide to testing positions and equipment." />
    <meta property="og:image" content="https://mycda.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A cyclist on an open road, with the question: What&apos;s your CdA?" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "MyCdA",
        "url": "https://mycda.app/",
        "description": "Estimates a cyclist's aerodynamic drag area (CdA) and rolling resistance (Crr) from power meter field tests with the virtual elevation method.",
        "applicationCategory": "SportsApplication",
        "operatingSystem": "Any (web browser)",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
